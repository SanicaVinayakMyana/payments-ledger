name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Tests use Testcontainers (PostgreSQL 16 + Redis 7) on the runner's Docker daemon.
      # `check` also enforces the 90% line-coverage gate.
      - name: Build, test and verify coverage
        run: ./gradlew --no-daemon build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test

      - name: Build container image
        run: docker build -t payments-ledger:${{ github.sha }} .
